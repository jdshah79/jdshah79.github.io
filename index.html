<script>
if (window.lucide) {
  lucide.createIcons();
}

function toggleChatbot() {
  document.getElementById('chatbotWindow').classList.toggle('active');
}

// ================= CONFIG =================
const HF_TOKEN = "YOUR_TOKEN_HERE";
const MODEL = "meta-llama/Llama-3.1-8B-Instruct";
// =========================================

// ✅ Local responses
const LOCAL_RESPONSES = {
  "ai projects": `
    <strong>AI Market Intelligence Platform:</strong><br>
    • Real-time trading dashboard<br>
    • Redis caching<br>
    • AI scoring engine
  `,
  "governance": `
    <strong>Open Source Governance (HSBC):</strong><br>
    • SBOM automation<br>
    • Compliance workflows<br>
    • AGPL conflict resolution
  `,
  "delivery leadership": `
    <strong>Delivery Leadership:</strong><br>
    • Managed 50+ engineers<br>
    • Agile transformation<br>
    • £5M+ programme delivery
  `,
  "cv": `Download CV or email <a href="mailto:tojanakonst div = document.createElement("div");

  div.style.margin = "10px 0";
  div.style.padding = "12px";
  div.style.borderRadius = "18px";
  div.style.maxWidth = "85%";

  if (sender === "user") {
    div.style.background = "#007bff";
    div.style.color = "white";
    div.style.marginLeft = "auto";
  } else {
    div.style.background = "#334155";
    div.style.color = "white";
  }

  div.innerHTML = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

async function sendMessage() {
  const input = document.getElementById("janak-chat-input");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const lowerText = text.toLowerCase();
  let matched = null;

  if (lowerText.includes("ai")) {
    matched = LOCAL_RESPONSES["ai projects"];
  } else if (lowerText.includes("governance") || lowerText.includes("hsbc")) {
    matched = LOCAL_RESPONSES["governance"];
  } else if (lowerText.includes("leadership") || lowerText.includes("management")) {
    matched = LOCAL_RESPONSES["delivery leadership"];
  } else if (lowerText.includes("cv") || lowerText.includes("resume")) {
    matched = LOCAL_RESPONSES["cv"];
  }

  if (matched) {
    setTimeout(() => addMessage(matched, "bot"), 300);
    return;
  }

  const thinking = addMessage("Thinking...", "bot");

  try {
    if (!HF_TOKEN || HF_TOKEN.includes("YOUR_")) {
      thinking.innerHTML = "⚠️ AI not configured yet.";
      return;
    }

    const res = await fetch("https://router.huggingface.co/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + HF_TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: "user", content: text }]
      })
    });

    const data = await res.json();

    let botResponse = data?.choices?.[0]?.message?.content || "No response";
    thinking.innerHTML = botResponse;

  } catch (err) {
    thinking.innerHTML = "⚠️ Connection error.";
  }
}

function sendPreset(topic) {
  const input = document.getElementById("janak-chat-input");
  input.value = topic;
  sendMessage();
}

document.getElementById("janak-chat-send")
  .addEventListener("click", sendMessage);

document.getElementById("janak-chat-input")
  .addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
