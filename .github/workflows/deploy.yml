name: Deploy with HF Token

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant permissions required for native GitHub Actions hosting
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject HF_TOKEN into index.html
        env:
          HF_SECRET: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "import os; f=open('index.html','r'); c=f.read(); f.close(); u=c.replace('YOUR_TOKEN_HERE', os.environ['HF_SECRET']); f=open('index.html','w'); f.write(u); f.close(); print('Token injected successfully.')"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
